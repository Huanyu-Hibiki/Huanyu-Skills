[project]
name = "whisper-transcribe"
version = "0.0.1"
description = "Whisper wrapper that transcribes audio files to text for PulseHub"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "openai-whisper>=20231117",
]

[project.scripts]
whisper-transcribe = "transcribe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["transcribe.py"]
