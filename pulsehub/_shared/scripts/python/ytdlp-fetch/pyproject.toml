[project]
name = "ytdlp-fetch"
version = "0.0.1"
description = "yt-dlp wrapper that fetches video metadata as normalized JSON for PulseHub"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "yt-dlp>=2024.10.7",
]

[project.scripts]
ytdlp-fetch = "fetch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["fetch.py"]
