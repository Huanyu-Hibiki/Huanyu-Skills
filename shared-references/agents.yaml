# agents.yaml — Agent 全局 skill 目录注册表
#
# 用途：声明各 AI Agent 在本机的全局/工作区 skill 安装目录，供
# scripts/inventory.py 枚举各 Agent 已安装的 skill（清单、重复对比、健康检查）。
# 探测不到的路径不是错误：脚本会将其标记为 not-installed。
#
# 用户可增删：可自由添加新 Agent 条目、追加候选路径、或将某个 Agent 置为
# enabled: false（保留条目但跳过盘点）。
#
# 本文件只支持下列 schema 子集，其他写法一律不被解析器接受：
#   - 顶层只有一个键 agents:，值为列表
#   - 每个条目恰好三个键：name（字符串）、enabled（true/false）、paths（字符串列表）
#   - 路径一律正斜杠写法；相对路径以本 yaml 所在目录为基准
#   - 路径支持 ~ 与 %USERPROFILE% 前缀写法，由 scripts/inventory.py 解析时展开为绝对路径
#
# 本机探测校准时间：2026-08-28（Windows，用户 kabuto）。
# 标注 [not-installed] 的路径为该 Agent 的已知默认位置，本机探测未发现，
# 安装对应 Agent 后无需改本文件即可被自动识别。

# 注意：同一条目的多条 paths 是 fallback 关系——只有第一个实际存在的路径
# 会被枚举，其余被遮蔽。一个 Agent 有多个"同时活跃"的 skill 根目录时
# （如 opencode 的全局/工作区/项目级），请拆成多个条目（见 opencode-* 示例）。

agents:
  # opencode 拆三条目：三条路径本机同时活跃，fallback 语义会互相遮蔽
  - name: opencode-global
    enabled: true
    paths:
      # opencode 全局目录（XDG 风格）[not-installed 2026-08-28]
      - C:/Users/kabuto/.config/opencode/skills

  - name: opencode-config-repo
    enabled: true
    paths:
      # 配置源仓库（git 管理的类目式两层结构：skills/<类目>/<skill>）
      - C:/Users/kabuto/.config/opencode/.opencode/skills

  - name: opencode-workspace
    enabled: true
    paths:
      # opencode 工作区级目录（C:\work 工作区）
      - C:/work/.opencode/skills

  - name: opencode-project
    enabled: true
    paths:
      # opencode 项目级目录（HuanyuCode 项目）
      - C:/work/HuanyuCode/.opencode/skills

  - name: claude-code
    enabled: true
    paths:
      # Claude Code 全局目录 [not-installed 2026-08-28]
      - C:/Users/kabuto/.claude/skills

  - name: codex
    enabled: true
    paths:
      # Codex CLI 全局目录 [not-installed 2026-08-28]
      - C:/Users/kabuto/.codex/skills

  - name: trae
    enabled: true
    paths:
      # Trae 全局扩展存储下的 skills 目录；父目录 globalStorage 已确认存在，
      # 但其中尚未发现 skills 类子目录 [not-installed 2026-08-28]
      - C:/Users/kabuto/AppData/Roaming/Trae/User/globalStorage/skills

  - name: gemini
    enabled: true
    paths:
      # Gemini CLI 全局目录 [not-installed 2026-08-28]
      - C:/Users/kabuto/.gemini/skills

  - name: cursor
    enabled: true
    paths:
      # Cursor 全局目录 [not-installed 2026-08-28]
      - C:/Users/kabuto/.cursor/skills
