[project]
name = "video-production-workflow"
version = "0.1.0"
description = "Video production workflow scripts"
requires-python = ">=3.11,<3.14"
dependencies = [
    "faster-whisper",
    "google-genai",
    "imageio",
    "librosa",
    "matplotlib",
    "modelscope",
    "numpy",
    "pillow",
    "requests",
    "python-dotenv",
    "websockets",
]

[project.optional-dependencies]
manim = ["manim"]
# Fun-ASR 已不参与默认转录（默认 faster-whisper，备选 whisper）；
# 仅需要 legacy funasr_srt.py 时安装：uv sync --extra funasr
funasr = ["funasr"]
# openai-whisper 备选引擎及其 PyTorch 依赖移出默认安装：
# 默认引擎 faster-whisper 走 ctranslate2，不需要 torch（默认 .venv 约 0.7GB，
# 加 whisper 备选约 5.5GB）。需要 --engine whisper 时：uv sync --extra whisper
whisper = [
    "openai-whisper",
    "torch==2.7.1+cu126",
    "torchaudio==2.7.1+cu126",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }
